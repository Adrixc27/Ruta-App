<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>R.U.T.A.</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap" />
    <link rel="stylesheet" href="lib/leaflet/leaflet.css" />
    <link rel="stylesheet" href="_content/RutaApp.Blazor/app.css" />
    <link rel="icon" href="data:," />
    <style>
        /* Pantalla de carga inicial: se ve mientras arranca la app, antes de que cargue Blazor */
        #app > .arranque { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
            background: linear-gradient(160deg, #EFF6FF 0%, #E6F0FA 50%, #DCEAF8 100%); font-family: 'Source Sans 3', 'Segoe UI', sans-serif; color: #2563EB; }
        .arranque-logo { width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #3B82F6, #1D4ED8); color: #fff; font-size: 38px; font-weight: 900;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(37, 99, 235, .3); animation: arranque-bote 1s ease-in-out infinite; }
        .arranque b { font-size: 26px; font-weight: 900; letter-spacing: .06em; }
        .arranque span { font-size: 14px; font-weight: 600; color: #4A6FA5; }
        .arranque-barra { width: 180px; height: 5px; border-radius: 3px; background: #BFDBFE; overflow: hidden; position: relative; }
        .arranque-barra i { position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 3px; background: #2563EB; animation: arranque-avanza 1.2s ease-in-out infinite; }
        @keyframes arranque-bote { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes arranque-avanza { 0% { left: -40%; } 100% { left: 100%; } }
    </style>
</head>

<body>

    <div id="app">
        <div class="arranque">
            <div class="arranque-logo">R</div>
            <b>RUTA</b>
            <div class="arranque-barra"><i></i></div>
            <span>Cargando…</span>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        Ocurrió un error inesperado.
        <a href="." class="reload">Recargar</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Leaflet: la única librería de JavaScript que dibuja el mapa (se controla desde C#) -->
    <script src="lib/leaflet/leaflet.js"></script>
    <script src="_content/RutaApp.Blazor/mapa.js"></script>
    <script src="_framework/blazor.webview.js"></script>

</body>

</html>
